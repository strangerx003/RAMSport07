# Render blueprint for the server-backed RAMSport build.
#
# The app runs as a Node web service. Workspace data is stored in MongoDB, which
# is required here because Render's free plan has no persistent disk.
services:
  - type: web
    name: ramsport
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- -p $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DATABASE
        value: ramsport
      - key: RAMSPORT_SESSION_SECRET
        sync: false
